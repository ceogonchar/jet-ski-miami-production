    "text": "One jet ski with one rider: 1 hour $189, 2 hours $349 (with a 30-minute bonus, so 2.5 hours on the water), 3 hours $499, Full Day (4 hours) $649. Fuel, life vests, GPS and the safety briefing are included. An extra passenger is $30. Tax and booking fees are shown at checkout before you pay."

  },
  {

  {
   "@type": "Question",
   "name": "What is the minimum age?",
   "acceptedAnswer": {

  },
  {
   "@type": "Question",
   "name": "Can two people ride one jet ski?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "Yes, up to 2 people can share a jet ski. The base price includes one rider; an extra passenger is $30."
   }
  },
  {

   "acceptedAnswer": {
    "@type": "Answer",
    "text": "Yes, every rental is self-guided. After a safety briefing you ride your own route (Haulover sandbar, Venetian Islands, Downtown skyline) inside a GPS-monitored zone. No instructor rides behind you."

  },

   "@type": "Question",

   "acceptedAnswer": {
    "@type": "Answer",
