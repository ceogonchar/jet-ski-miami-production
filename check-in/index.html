<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#10384c"><title>Guest check-in · Jet Ski Miami 7</title><link rel="stylesheet" href="styles.css?v=20260911-3"></head><body><header><a class="brand" href="/" aria-label="Jet Ski Miami 7"><span class="brand-mark" aria-hidden="true"><img src="/assets/logo-jetmiami-Bg1hzFaL.png" width="1024" height="1024" alt=""></span><span class="brand-copy"><strong>Jet Ski Miami 7</strong><span>Guest check-in</span></span></a></header><main><section><h1>Your check-in.</h1><p id="status" role="status" aria-live="polite">Opening your secure check-in…</p><noscript><p>Please enable JavaScript to open your check-in, or contact the team for help.</p></noscript><p><a href="mailto:goncharboats@gmail.com">Need help? Contact our team</a></p></section></main><footer>Gonchar Group LLC</footer><script>'use strict';
(async()=>{
 const hash=new URLSearchParams(location.hash.slice(1)),token=hash.get('invite'),group=hash.get('join'),booking=hash.get('booking'),team=location.hash==='#team';
 if(token||group||booking||team)history.replaceState(null,'',location.pathname);
 try{
  const r=await fetch('backend.json?t='+Date.now(),{cache:'no-store',credentials:'omit'});if(!r.ok)throw Error('route');
  const c=await r.json(),u=new URL(c.origin);
  if(u.protocol!=='https:'||u.username||u.password||u.port||u.pathname!=='/'||u.search||u.hash||!(/^[a-z0-9-]+\.trycloudflare\.com$/.test(u.hostname)||u.hostname==='sign.jet-ski-miami.com'))throw Error('origin');
  let route='/check-in';
  if(token||group){const t=token||group;if(!/^[A-Za-z0-9_-]{32,100}$/.test(t))throw Error('invite');route=(token?'/s/':'/join/')+encodeURIComponent(t)}
  else if(team)route='/staff';
  else if(booking)route+='?booking='+encodeURIComponent(booking.slice(0,100));
  location.replace(u.origin+route);
 }catch(e){document.querySelector('#status').textContent='Check-in is temporarily unavailable. Please try again or contact our team at goncharboats@gmail.com.';}
})();
</script></body></html>
