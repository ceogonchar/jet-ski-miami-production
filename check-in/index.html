<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Guest check-in · Jet Ski Miami 7</title><link rel="preconnect" href="https://referrals-careers-meaningful-twice.trycloudflare.com"><script>'use strict';
(async()=>{
 const hash=new URLSearchParams(location.hash.slice(1)),token=hash.get('invite'),group=hash.get('join'),booking=hash.get('booking'),team=location.hash==='#team';
 if(token||group||booking||team)history.replaceState(null,'',location.pathname);
 try{
  const r=await fetch('backend.json?t='+Date.now(),{cache:'no-store',credentials:'omit'});if(!r.ok)throw Error('route');
  const c=await r.json(),u=new URL(c.origin);
  if(u.protocol!=='https:'||u.username||u.password||u.port||u.pathname!=='/'||u.search||u.hash||!(/^[a-z0-9-]+\.trycloudflare\.com$/.test(u.hostname)||u.hostname==='sign.jet-ski-miami.com'))throw Error('origin');
  let route='/check-in';
  if(token||group){const t=token||group;if(!/^[A-Za-z0-9_-]{32,100}$/.test(t))throw Error('invite');route=(token?'/s/':'/join/')+encodeURIComponent(t)}
  else if(team)route='/staff';
  else if(booking)route+='?booking='+encodeURIComponent(booking.slice(0,100));
  location.replace(u.origin+route);
 }catch(e){const show=()=>{document.querySelector('#status').textContent='Check-in is temporarily unavailable. Please try again or contact our team at goncharboats@gmail.com.'};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',show,{once:true});else show();}
})();
</script><style>body{margin:0;background:#f7f9fa;color:#153b49;font:16px/1.6 system-ui,sans-serif}main{max-width:480px;margin:15vh auto;padding:28px}h1{font-size:24px;letter-spacing:-.5px}a{color:#087783;font-size:14px}p{color:#647b85}</style></head><body><main><strong>Jet Ski Miami 7</strong><h1>Guest check-in</h1><p id="status" role="status">Opening your secure check-in…</p><noscript>Please enable JavaScript to open your check-in.</noscript><a href="mailto:goncharboats@gmail.com">Contact the team</a></main></body></html>
