<style>
:root{
  --bg:#f3f1ec; --ink:#12151a; --mut:#5e6772; --line:#d8d3c8;
  --card:#fff; --sea:#0b6b74; --sea2:#0a4f56; --hot:#b3400c;
  --ok:#0d6b39; --warn:#8a5a00; --soft:#eef6f6; --caps:#1a1a1a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit}
.shell{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--card);
  box-shadow:0 0 0 1px var(--line),0 18px 50px rgba(16,24,32,.08)}
.bar{position:sticky;top:0;z-index:20;background:#12151a;color:#fff;padding:10px 14px 12px}
.bar .who{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.bar .ttl{font-weight:750;font-size:15px;margin-top:2px}
.bar .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:8px;opacity:.85}
.prog{height:3px;background:#2a3038;margin-top:10px;border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:#3ecad4;width:0;transition:width .25s}
.pad{padding:16px 16px 110px}
h1{font-size:22px;line-height:1.2;margin:0 0 8px;letter-spacing:-.02em}
h2{font-size:17px;margin:22px 0 8px}
h3{font-size:14px;margin:16px 0 6px;letter-spacing:.02em}
p,li{font-size:14.5px}
.mut{color:var(--mut)}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:var(--soft);color:var(--sea);padding:4px 8px;border-radius:99px}
.warnbox{border:2px solid #111;background:#f4f1ea;padding:12px;margin:12px 0}
.warnbox.hot{border-color:var(--hot);background:#fff4ef}
.warnbox.ok{border-color:var(--ok);background:#f1faf4}
.caps{font-weight:800;text-transform:uppercase;font-size:13.5px;line-height:1.4}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{margin:8px 0}
.field label{display:block;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.field .val,.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fafafa}
.field input{background:#fff}
.ro{background:#f6f6f4!important}
.init{border:1.5px dashed #9aa;border-radius:12px;padding:10px;margin:14px 0;background:#fbfaf7}
.init.on{border-style:solid;border-color:var(--ok);background:#f1faf4}
.init b{display:block;font-size:13px;margin-bottom:8px}
.init canvas,.sig canvas{width:100%;height:88px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none}
.sig canvas{height:120px}
.sig{margin:12px 0}
.tools{display:flex;gap:8px;margin-top:6px}
.tools button,.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
.check{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:14px}
.check input{margin-top:4px;transform:scale(1.15)}
.topic{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sticky{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;
  background:linear-gradient(transparent, #fff 28%);padding:18px 16px 18px;z-index:30}
.btn{width:100%;border:0;background:var(--sea);color:#fff;border-radius:12px;padding:14px 16px;font-weight:750;font-size:16px}
.btn:disabled{background:#b7c2c3}
.btn.sec{background:#12151a}
.sms{background:#12151a;color:#e8eef4;border-radius:16px;padding:14px 16px;margin:16px 0;font-size:14.5px;line-height:1.45}
.sms .from{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.55;margin-bottom:8px}
.hidden{display:none}
.done-card{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#fafafa}
.done-card img{max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.nav button{font-size:11px;padding:4px 8px;border-radius:99px}
.note{font-size:12.5px;color:var(--mut)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.cam{position:relative;background:#0b0f14;border-radius:14px;overflow:hidden}
.cam video{width:100%;display:block;max-height:280px;object-fit:cover}
.cam .oval{position:absolute;inset:12% 18%;border:2px solid #3ecad4;border-radius:50%;pointer-events:none}
.kyc-prev{width:100%;border-radius:12px;max-height:200px;object-fit:contain;background:#0b0f14;margin:10px 0}
.drop{margin:12px 0;border:2px dashed #b7b1a6;border-radius:16px;padding:18px 14px;text-align:center;background:#fafaf7}
.drop input{display:none}
.badge{font-size:10px;border-radius:99px;padding:2px 7px}
.high{background:#e5f7ec;color:var(--ok)}
.medium{background:#fff4d6;color:var(--warn)}
.missing{background:#ffe8e0;color:var(--hot)}
.faces{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.faces figure{margin:0;text-align:center}
.faces img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#0b0f14;border:2px solid var(--line)}
.faces figcaption{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.scorebig{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:8px 0 4px}
.notice{font-weight:800;text-transform:uppercase;font-size:15.5px;line-height:1.35;letter-spacing:.01em}
.roster{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:#fafafa}
.roster .who{font-weight:700}
.kid{color:var(--hot);font-weight:800}
.sitebar{max-width:430px;margin:0 auto;background:#050b14;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;font-size:13px}
.sitebar a{color:#8bd9ff;text-decoration:none;font-weight:650}
.sitebar .brand{color:#fff;font-weight:800;letter-spacing:-.02em}
</style>

const CONSENT_TEXT = "Florida law (chapter 668, including s. 668.50) and federal law (the ESIGN Act, 15 U.S.C. §§ 7001–7006) let us do this rental in writing on your phone instead of on paper. To continue you must agree to receive these documents electronically — the rental agreement, each adult’s release, any guardian form, the dock safety card and the FWC card. We will email a copy of whatever you sign to the address on the form, and you can download it from this link. A paper copy is free — ask at the dock or email privacy@jet-ski-miami.com. This consent is for this booking only. You may withdraw it before you sign by closing this page or emailing privacy@jet-ski-miami.com; we will then complete the papers on paper at the dock, which can delay or prevent departure. After you sign, we still keep the signed copy because Florida livery law requires us to. You will need: a current mobile browser (Safari 16 or later, or Chrome 120 or later), JavaScript enabled, and the ability to view a PDF. You must sign your own document. Staff will not sign for you. No adult may sign for another adult.";

};
function ageYears(dob){
  const p = String(dob||"").split("/");
  if(p.length!==3) return 99;
  const dt = new Date(+p[2], +p[0]-1, +p[1]);
  const now = new Date();
  let a = now.getFullYear()-dt.getFullYear();
  const m = now.getMonth()-dt.getMonth();
  if(m<0 || (m===0 && now.getDate()<dt.getDate())) a--;
  return a;
}
function roster(){
  if(BOOKING.roster && BOOKING.roster.length) return BOOKING.roster;
  return [{name:GUEST.name, dob:GUEST.dob, role:"renter"}];
}
function minors(){ return roster().filter(p=>ageYears(p.dob)<18); }
function hasMinors(){ return minors().length>0; }
function applyBookingFromUrl(){
  const m = location.pathname.match(/\/h\/([^/]+)/);
  const q = new URLSearchParams(location.search);
  const id = (m && m[1]) || q.get("gtt") || BOOKING.id;
  BOOKING.id = decodeURIComponent(id);
  const demo = (q.get("demo") || "").toLowerCase();
  if(/child/i.test(BOOKING.id) || demo==="child") setScenario("child", true);
  else if(/pair|two/i.test(BOOKING.id) || demo==="pair") setScenario("pair", true);
  else if(/GROUP|GTT0/i.test(BOOKING.id) || demo==="group") setScenario("group", true);
  else setScenario("solo", true);
}
function setScenario(kind, silent){
  if(kind==="child"){
    BOOKING.roster = [
      {name:GUEST.name, dob:GUEST.dob, role:"renter"},
      {name:"Sofia Gonchar", dob:"06/12/2014", role:"minor", relation:"Daughter"},
    ];
    if(!silent && !/CHILD/i.test(BOOKING.id)) BOOKING.id = "GTT-STAFF-CHILD";
  } else if(kind==="pair"){
    BOOKING.roster = [
      {name:GUEST.name, dob:GUEST.dob, role:"renter"},
      {name:"Nataly Gonchar", dob:"05/02/1994", role:"adult"},
    ];
    if(!silent && !/PAIR/i.test(BOOKING.id)) BOOKING.id = "GTT-STAFF-PAIR";
  } else if(kind==="group"){
    BOOKING.roster = [
      {name:"Dmytro Gonchar", dob:"03/17/1992", role:"renter"},
      {name:"Nataly Gonchar", dob:"05/02/1994", role:"adult"},
      {name:"Alex Petrov", dob:"01/15/1990", role:"adult"},

      {name:"Ivan Koval", dob:"08/08/1987", role:"adult"},
      {name:"Oksana Koval", dob:"11/11/1995", role:"adult"},
      {name:"Sofia Gonchar", dob:"06/12/2014", role:"minor", relation:"Daughter"},
      {name:"Marco Gonchar", dob:"09/03/2018", role:"minor", relation:"Son"},
    ];
    BOOKING.skis = 4;
    BOOKING.date = "Sat, Aug 22, 2026";
    BOOKING.start = "11:00 AM";
    BOOKING.arrive = "10:30 AM";

    BOOKING.hold = "$129.80";

  if(!silent){ save(); render(); }
}
window.setScenario = setScenario;

function elapsed(){
  const s = Math.floor((Date.now()-state.t0)/1000);
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
function go(step){
  if(state.step==="kyc" && step!=="kyc" && window.JSMKyc) JSMKyc.stopCamera();
  state.step = step;
  location.hash = step;
  render();

}
function mark(k){state.checks[k]=true; save(); render();}
function save(){ try{ localStorage.setItem("gtt_test_016", JSON.stringify({...state, t0:state.t0})); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem("gtt_test_016");
    if(!raw) return;
    const o = JSON.parse(raw);
    Object.assign(state, o);
    if(!state.t0) state.t0 = Date.now();
    if(!state.markTimes) state.markTimes = {};
    if(!state.records) state.records = {};
  }catch(e){}
  if(!state.personId){
    state.personId = (crypto.randomUUID && crypto.randomUUID()) || ("p-"+Date.now());
    save();
  }
}
function utcIso(ms){
  return new Date(ms || Date.now()).toISOString().replace(/\.\d{3}Z$/,"Z");
}
async function sha256Hex(s){
  if(!crypto.subtle) return "";
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s || ""));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function collectMarks(ids, store, type){
  return ids.filter(id=>store[id]).map(id=>({
    field_id: id,
    mark_type: type,
    png: store[id],
    signed_at_utc: state.markTimes[id] || utcIso(),
  }));
}
function instrumentMarks(code){
  if(code==="HOME-A") return collectMarks(["A1","A2","A3","A4","A5"], state.initials, "initial").concat(collectMarks(["Asig"], state.sigs, "signature"));
  if(code==="HOME-B") return collectMarks(["B1"], state.initials, "initial").concat(collectMarks(["Bsig"], state.sigs, "signature"));
  if(code==="HOME-C") return collectMarks(["C1","C2"], state.initials, "initial").concat(collectMarks(["CsigA","CsigB"], state.sigs, "signature"));
  if(code==="DOCK-DR") return collectMarks(["Wsig"], state.sigs, "signature");
  if(code==="DOCK-D"){
    const ids = [];
    for(let i=1;i<=15;i++) ids.push("D"+i);
    return collectMarks(ids.concat(["DP","DN","DB","DL"]), state.initials, "initial").concat(collectMarks(["Dsig"], state.sigs, "signature"));
  }
  if(code==="DOCK-E") return collectMarks(["Esig","Einstr"], state.sigs, "signature");
  return [];
}
function instrumentFields(code){
  if(code==="HOME-A") return {ins:state.ins, card:state.card, sms:!!state.sms};
  if(code==="HOME-B") return {media:!!state.media, age18:!!state.checks.age, self:!!state.checks.self, minors:minors().map(p=>p.name)};
  if(code==="HOME-C") return {children:minors(), guardian:GUEST.name};
  if(code==="DOCK-DR") return {wet:"refuse", boards:true};
  if(code==="DOCK-E"){
    const boxes={};
    for(let i=1;i<=24;i++) boxes["E"+i]=!!state.checks["E"+i];
    return boxes;
  }
  return {};
}
async function persistInstrument(code){
  const displayed = (code==="CONSENT") ? CONSENT_TEXT : ($("app").innerText || "");
  const hash = await sha256Hex(displayed);
  const payload = {
    instrument_code: code,
    booking_id: BOOKING.id,
    displayed_text: displayed,
    displayed_text_sha256: hash,
    who: { person_id: state.personId, name: GUEST.name, role: code==="DOCK-E"?"renter+instructor_test":"renter" },
    tz_offset_minutes: -new Date().getTimezoneOffset(),
    marks: instrumentMarks(code),
    fields: instrumentFields(code),
    id_session_id: state.kyc.sessionId || state.kyc.session || null,
    face_score: state.kyc.score,
    kyc_verdict: state.kyc.verdict,
    liveness_ok: !!state.kyc.livenessOk,
    consent_esign_at_utc: state.consentAt,
    consent_esign_text_sha256: await sha256Hex(CONSENT_TEXT),
    page_url: location.pathname + "#" + (code==="CONSENT"?"start":state.step),
  };
  let data = null;
  try {
    const r = await fetch("/api/record", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    if (r.ok) data = await r.json();
  } catch (e) {}
  if (!data || !data.ok) {
    const rec_id = utcIso().replace(/[-:]/g,"") + "-" + Math.random().toString(16).slice(2,8);
    data = {
      ok: true,
      record_id: rec_id,
      instrument_code: code,
      booking_id: BOOKING.id,
      signed_at_utc: utcIso(),
      pdf_url: "/sign/pack.html?b=" + encodeURIComponent(BOOKING.id),
      pack_url: "/sign/pack.html?b=" + encodeURIComponent(BOOKING.id)
    };
    const key = "jsm_pack_" + BOOKING.id;
    const pack = JSON.parse(localStorage.getItem(key) || "[]");
    pack.push(Object.assign({}, data, {payload: payload}));

function bindPad(id, store){
  const cv = $("cv-"+id);
  if(!cv || cv.dataset.bound) return;
  cv.dataset.bound = "1";
  const ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio||1;
  const fit=()=>{
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = Math.max(1,w*dpr); cv.height = Math.max(1,h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth = 2.2; ctx.lineCap="round"; ctx.strokeStyle="#111";
    if(store[id]){
      const img = new Image();
      img.onload=()=>ctx.drawImage(img,0,0,w,h);
      img.src=store[id];
    }
  };
  fit();
  let draw=false, last=null;
  const pos=e=>{
    const r=cv.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return {x:t.clientX-r.left,y:t.clientY-r.top};
  };
  const start=e=>{draw=true; last=pos(e); e.preventDefault();};
  const move=e=>{
    if(!draw) return;
    const p=pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last=p; e.preventDefault();
  };
  const end=()=>{
    if(!draw) return;
    draw=false;
    store[id]=cv.toDataURL("image/png");
    state.markTimes[id]=utcIso();
    if(store===state.initials) state.masterInitial = store[id];
    if(store===state.sigs && id!=="Einstr") state.masterSig = store[id];
    stampFromMaster();
    save();
    render();
  };
  cv.addEventListener("mousedown",start);
  cv.addEventListener("mousemove",move);
  cv.addEventListener("mouseup",end);
  cv.addEventListener("mouseleave",end);
  cv.addEventListener("touchstart",start,{passive:false});
  cv.addEventListener("touchmove",move,{passive:false});
  cv.addEventListener("touchend",end);
}

function padsOnStep(){
  const s=state.step;
  if(s==="homeA") return {init:["A1","A2","A3","A4","A5"], sig:["Asig"]};
  if(s==="homeB") return {init:["B1"], sig:["Bsig"]};
  if(s==="homeC") return {init:["C1","C2"], sig:["CsigA","CsigB"]};
  if(s==="dockDR") return {init:[], sig:["Wsig"]};
  if(s==="dockD"){
    const init=[];
    for(let i=1;i<=15;i++) init.push("D"+i);
    return {init:init.concat(["DP","DN","DB","DL"]), sig:["Dsig"]};
  }
  if(s==="dockE") return {init:[], sig:["Esig"]};
  return {init:[], sig:[]};
}
function stampFromMaster(){
  const p=padsOnStep();
  if(state.masterInitial){
    p.init.forEach(id=>{
      if(!state.initials[id]){ state.initials[id]=state.masterInitial; state.markTimes[id]=utcIso(); }
    });
  }
  if(state.masterSig){
    p.sig.forEach(id=>{
      if(id==="Einstr") return;
      if(!state.sigs[id]){ state.sigs[id]=state.masterSig; state.markTimes[id]=utcIso(); }
    });
  }
}

function needC(){

function needDR(){

async function pullDidit(sid){

  state.kyc.verdict = data.verdict;
  state.kyc.status = data.status || "";

  state.kyc.livenessOk = !!data.liveness_ok;

  state.kyc.reason = data.verdict==="verified" ? "Didit approved the ID and the live selfie." : (data.error || "");

  save();

window.persistThen = persistThen;
window.afterB = afterB;
window.finish = finish;
const VIEWS = {start:viewStart,sms:viewSms,kyc:viewKyc,homeA:viewA,homeB:viewB,homeC:viewC,arrive:viewArrive,dockDR:viewDR,dockD:viewD,ride:viewRide,dockE:viewE,done:viewDone};

function render(){
  $("barTitle").textContent = TITLES[state.step]||"Jet Ski Miami";
  $("barStep").textContent = (STEPS.indexOf(state.step)+1)+" / "+STEPS.length;
  $("barFill").style.width = ((STEPS.indexOf(state.step))/(STEPS.length-1)*100)+"%";
  $("app").innerHTML = VIEWS[state.step]();
  renderSticky();
  requestAnimationFrame(()=>{
    stampFromMaster();
    if(state.step==="homeA"){
      ["A1","A2","A3","A4","A5"].forEach(id=>bindPad(id,state.initials));
      bindPad("Asig",state.sigs);
    }
    if(state.step==="homeB"){
      bindPad("B1",state.initials); bindPad("Bsig",state.sigs);
    }
    if(state.step==="homeC"){
      bindPad("C1",state.initials); bindPad("C2",state.initials);
      bindPad("CsigA",state.sigs); bindPad("CsigB",state.sigs);
    }
    if(state.step==="dockDR"){
      bindPad("Wsig",state.sigs);
    }
    if(state.step==="dockD"){
      for(let i=1;i<=15;i++) bindPad("D"+i,state.initials);
      ["DP","DN","DB","DL"].forEach(id=>bindPad(id,state.initials));
      bindPad("Dsig",state.sigs);
    }
    if(state.step==="dockE"){
      bindPad("Esig",state.sigs); bindPad("Einstr",state.sigs);
    }
    if(state.step==="kyc"){
      /* Didit is a redirect — nothing to bind here */
    }
  });
}

applyBookingFromUrl();
load();
if(location.hash){
  const h=location.hash.slice(1);
  if(STEPS.includes(h)) state.step=h;
}
(function takeDiditReturn(){
  const q = new URLSearchParams(location.search);
  const sid = q.get("didit");
  if(!sid) return;
  state.step = "kyc";
  pullDidit(sid).then(()=>{
    history.replaceState({}, "", location.pathname+"#kyc");
    render();
  }).catch((e)=>{
    state.kyc.verdict = "failed";
    state.kyc.reason = e.message || "Didit did not return a result";
    render();
  });
})();
render();
setInterval(()=>{ const t=$("timer"); if(t) t.textContent=elapsed(); },500);
</script>
