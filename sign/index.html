function ageYears(dob){
  const p = String(dob||"").split("/");
  if(p.length!==3) return null;
  const mo=+p[0], d=+p[1], y=+p[2];
  if(!mo||!d||!y||y<1900||y>2100) return null;
  const dt = new Date(y, mo-1, d);
  if(dt.getMonth()!==mo-1 || dt.getDate()!==d) return null;
  const now = new Date();
  let a = now.getFullYear()-dt.getFullYear();
  const m = now.getMonth()-dt.getMonth();
  if(m<0 || (m===0 && now.getDate()<dt.getDate())) a--;
  return a;
}

function currentSteps(){

  if(!isDock() && state.who!=="husband" && !hasMinors()) s = s.filter(x=>x!=="homeC");
  return s;
}

function $(id){return document.getElementById(id)}
function elapsed(){
  const s = Math.floor((Date.now()-state.t0)/1000);
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
function go(step){
  if((state.who||"renter")==="husband" && (step==="homeA"||step==="homeC")){
    step = "homeB";
  }
  const allowed = currentSteps();
  if(step==="homeC" && !hasMinors()) step = "done";
  if(!isDock() && ["arrive","dockDR","dockD","ride","dockE","staff"].includes(step) && state.who!=="instructor"){
    step = allowed.includes("done") ? "done" : allowed[allowed.length-1];
  }
  if(!allowed.includes(step) && step!=="noride"){
    step = allowed[0] || "start";
  }
  state.step = step;
  location.hash = step;
  render();
  window.scrollTo(0,0);
}
function husbandIndex(){
  const i = roster().findIndex(p=>p.role==="adult" || /husband/i.test(p.relation||""));

}
function signer(){

    const i = husbandIndex();

    return {
      name: row.name||"",
      dob: row.dob||"",
      phone: row.phone||"",
      email: row.email||"",
      addr: row.addr||"",
      city: row.city||"",
      state: row.state||"",

      row,

}
function setSigner(k, v){
  v = (v||"").trim();
  if(state.who==="husband"){
    const i = husbandIndex();
    if(i<0) return;
    BOOKING.roster[i][k] = v;
    save();
    return;
  }
  GUEST[k] = v;
  if(k==="name" && roster()[0] && roster()[0].role==="renter") roster()[0].name = v;
  if(k==="dob" && roster()[0] && roster()[0].role==="renter") roster()[0].dob = v;

}
function parseMoney(s){

}
function missingA(){
  const miss=[];
  if(!GUEST.name || /guest$/i.test(GUEST.name.trim())) miss.push("your full legal name");
  if(ageYears(GUEST.dob)==null) miss.push("your date of birth");
  else if(ageYears(GUEST.dob)<21) miss.push("renter must be 21 or older");
  if(!GUEST.addr || !GUEST.city || !GUEST.state || !GUEST.zip) miss.push("your address");
  if(!GUEST.emName || !GUEST.emPhone || !GUEST.emAddr) miss.push("emergency contact (name, address, phone)");
  if(!/^[0-9]{4}$/.test(String(GUEST.card||""))) miss.push("last 4 of the credit card you will bring");
  roster().forEach((p,i)=>{
    const label = p.relation||p.role||("person "+(i+1));
    if(!p.name) miss.push(label+" full name");
    if(!p.dob) miss.push(label+" date of birth");
  });
  if(!["A1","A2","A3","A4","A5"].every(k=>state.initials[k]) || !state.sigs.Asig) miss.push("five initials and your signature");
  if(!state.ins) miss.push("insurance accept or decline");
  if(!state.card) miss.push("boating-card answer");
  return miss;
}
function mark(k){state.checks[k]=true; save(); render();}
function storageKey(){ return "jsm_sign_v2_"+(BOOKING.id||"x")+"_"+(state.who||"renter"); }
function save(){ try{ localStorage.setItem(storageKey(), JSON.stringify({...state, t0:state.t0})); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(storageKey());
    if(!raw) return;
    const o = JSON.parse(raw);
    Object.assign(state, o);
    if(!state.t0) state.t0 = Date.now();
    if(!state.markTimes) state.markTimes = {};
    if(!state.records) state.records = {};
  }catch(e){}
  if(!state.personId){
    state.personId = (crypto.randomUUID && crypto.randomUUID()) || ("p-"+Date.now());
    save();
  }
}
function utcIso(ms){
  return new Date(ms || Date.now()).toISOString().replace(/\.\d{3}Z$/,"Z");
}
async function sha256Hex(s){
  if(!crypto.subtle) return "";
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s || ""));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function collectMarks(ids, store, type){
  return ids.filter(id=>store[id]).map(id=>({
    field_id: id,
    mark_type: type,
    png: store[id],
    signed_at_utc: state.markTimes[id] || utcIso(),
  }));
}
function instrumentMarks(code){
  if(code==="HOME-A") return collectMarks(["A1","A2","A3","A4","A5"], state.initials, "initial").concat(collectMarks(["Asig"], state.sigs, "signature"));
  if(code==="HOME-B") return collectMarks(["B1"], state.initials, "initial").concat(collectMarks(["Bsig"], state.sigs, "signature"));
  if(code==="HOME-OP") return collectMarks(["O1","O2","O3"], state.initials, "initial").concat(collectMarks(["Osig"], state.sigs, "signature"));
  if(code==="HOME-C") return collectMarks(["C1","C2"], state.initials, "initial").concat(collectMarks(["CsigA","CsigB"], state.sigs, "signature"));
  if(code==="DOCK-DR") return collectMarks(["Wsig"], state.sigs, "signature");
  if(code==="DOCK-D"){
    const ids = [];
    for(let i=1;i<=15;i++) ids.push("D"+i);
    return collectMarks(ids.concat(["DP","DN","DB","DL"]), state.initials, "initial").concat(collectMarks(["Dsig"], state.sigs, "signature"));
  }
  if(code==="DOCK-E") return collectMarks(["Esig","Einstr"], state.sigs, "signature");
  return [];
}
function instrumentFields(code){
  if(code==="HOME-A") return {ins:state.ins, card:state.card, sms:!!state.sms};
  if(code==="HOME-B") return {media:!!state.media, age18:!!state.checks.age, self:!!state.checks.self, signer:signer().name, signer_dob:signer().dob, minors:minors().map(p=>p.name)};
  if(code==="HOME-OP") return {driver:true, name:signer().name, dob:signer().dob, age:ageYears(signer().dob)};
  if(code==="HOME-C") return {children:minors(), guardian:GUEST.name};
  if(code==="DOCK-DR") return {wet:"refuse", boards:false, noRide:true};
  if(code==="DOCK-E"){
    const boxes={};
    for(let i=1;i<=24;i++) boxes["E"+i]=!!state.checks["E"+i];
    return boxes;
  }
  return {};
}
async function persistInstrument(code){
  const displayed = (code==="CONSENT") ? CONSENT_TEXT : ($("app").innerText || "");
  const hash = await sha256Hex(displayed);
  const payload = {
    instrument_code: code,
    booking_id: BOOKING.id,
    displayed_text: displayed,
    displayed_text_sha256: hash,
    who: { person_id: state.personId, name: (signer().name||GUEST.name||""), role: state.who==="instructor"?"instructor":(state.who||"renter") },
    tz_offset_minutes: -new Date().getTimezoneOffset(),
    marks: instrumentMarks(code),
    fields: instrumentFields(code),
    id_session_id: state.kyc.sessionId || state.kyc.session || null,
    face_score: state.kyc.score,
    kyc_verdict: state.kyc.verdict,
    liveness_ok: !!state.kyc.livenessOk,
    consent_esign_at_utc: state.consentAt,
    consent_esign_text_sha256: await sha256Hex(CONSENT_TEXT),
    page_url: location.pathname + "#" + (code==="CONSENT"?"start":state.step),
  };
  let data = null;
  const endpoints = [];
  if(window.JSM_RECORD_API) endpoints.push(String(window.JSM_RECORD_API).replace(/\/$/,"")+"/api/record");
  endpoints.push("/api/record");
  for(const url of endpoints){
    try {
      const r = await fetch(url, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });
      if(r.ok){ data = await r.json(); if(data && data.ok) break; }
    } catch (e) {}
  }
  if(!data || !data.ok){
    const api = (window.JSM_RECORD_API||"").replace(/\/$/,"") + "/api/record";
    if(window.JSM_RECORD_API){
      try{
        const r2 = await fetch(api, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify(payload)
        });
        if(r2.ok) data = await r2.json();
      }catch(e){}
    }
  }
  if(!data || !data.ok){
    throw new Error("Could not save "+code+". Stay on this page and try again. The company must keep a copy.");
  }
  try{
    const key = "jsm_pack_"+BOOKING.id;
    const pack = JSON.parse(localStorage.getItem(key)||"[]");
    pack.push(Object.assign({}, data, {payload, who: payload.who}));
    localStorage.setItem(key, JSON.stringify(pack));
    localStorage.setItem("jsm_pack_"+BOOKING.id+"_"+(state.who||"renter"), JSON.stringify(pack));
  }catch(e){}
  state.records[code] = data;
  save();
  return data;
}
async function persistThen(code, next){
  stampFromMaster();
  save();
  const el = $("sticky");
  if(el) el.innerHTML = `<button class="btn" disabled>Saving ${code}…</button>`;
  try{
    await persistInstrument(code);
    go(next);
  }catch(err){
    alert("Could not save "+code+": "+err.message);
    renderSticky();
  }
}

window.saveEdit = function(el){
  const k = el.dataset.edit;
  const v = (el.value||"").trim();
  if(k.startsWith("me.")){
    setSigner(k.slice(3), v);
    return;
  }
  if(k.startsWith("roster.")){
    const parts = k.split(".");
    const i = +parts[1];
    const field = parts[2];
    if(BOOKING.roster[i]) BOOKING.roster[i][field] = v;
    if(BOOKING.roster[i] && BOOKING.roster[i].role==="renter" && field==="name") GUEST.name = v;
    if(BOOKING.roster[i] && BOOKING.roster[i].role==="renter" && field==="dob") GUEST.dob = v;

};
function masterFor(id, store){
  if(store===state.initials){
    if(id==="C2") return null;
    return state.masterInitial;
  }
  if(store===state.sigs && id!=="Einstr" && id!=="CsigB") return state.masterSig;
  return null;
}
function applyMaster(id, store){
  const m = masterFor(id, store);
  if(!m) return false;
  store[id]=m;
  state.markTimes[id]=utcIso();
  save();
  render();
  return true;
}

window.placeTyped = function(id, kind){
  const inp = $("type-"+id);
  const txt = ((inp && inp.value) || "").trim();
  if(!txt){ alert("Type your initials or name first."); return; }
  const cv = $("cv-"+id);
  if(!cv) return;
  const ctx = cv.getContext("2d");
  const w = cv.clientWidth, h = cv.clientHeight;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  const dpr = window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = "#111";
  ctx.font = (kind==="sig"?"28px":"26px")+" 'Segoe Script', 'Snell Roundhand', cursive";
  ctx.fillText(txt, 16, kind==="sig"?70:52);
  const store = kind==="sig"?state.sigs:state.initials;
  store[id] = cv.toDataURL("image/png");
  state.markTimes[id] = utcIso();
  if(kind!=="sig" && id!=="C2") state.masterInitial = store[id];
  if(kind==="sig" && id!=="Einstr" && id!=="CsigB") state.masterSig = store[id];
  save();
  render();
};

function bindPad(id, store){
  const cv = $("cv-"+id);
  if(!cv || cv.dataset.bound) return;
  cv.dataset.bound = "1";
  const ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio||1;
  const fit=()=>{
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = Math.max(1,w*dpr); cv.height = Math.max(1,h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth = 2.2; ctx.lineCap="round"; ctx.strokeStyle="#111";
    if(store[id]){
      const img = new Image();
      img.onload=()=>ctx.drawImage(img,0,0,w,h);
      img.src=store[id];
    }
  };
  fit();
  let draw=false, last=null, dist=0;
  const pos=e=>{
    const r=cv.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return {x:t.clientX-r.left,y:t.clientY-r.top};
  };
  const start=e=>{draw=true; last=pos(e); dist=0; e.preventDefault();};
  const move=e=>{
    if(!draw) return;
    const p=pos(e);
    dist += Math.hypot(p.x-last.x, p.y-last.y);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last=p; e.preventDefault();
  };
  const end=()=>{
    if(!draw) return;
    draw=false;
    if(dist < 10 && !store[id] && applyMaster(id, store)) return;
    if(dist < 10 && store[id]) return;
    store[id]=cv.toDataURL("image/png");
    state.markTimes[id]=utcIso();
    if(store===state.initials && id!=="C2") state.masterInitial = store[id];
    if(store===state.sigs && id!=="Einstr" && id!=="CsigB") state.masterSig = store[id];
    save();
    render();
  };
  cv.addEventListener("mousedown",start);
  cv.addEventListener("mousemove",move);
  cv.addEventListener("mouseup",end);
  cv.addEventListener("mouseleave",end);
  cv.addEventListener("touchstart",start,{passive:false});
  cv.addEventListener("touchmove",move,{passive:false});
  cv.addEventListener("touchend",end);
}
window.clearPad=function(id){
  delete state.initials[id]; delete state.sigs[id];
  save(); render();
};
function padsOnStep(){
  const s=state.step;
  if(s==="homeA") return {init:["A1","A2","A3","A4","A5"], sig:["Asig"]};
  if(s==="homeB") return {init:["B1"], sig:["Bsig"]};
  if(s==="homeOp") return {init:["O1","O2","O3"], sig:["Osig"]};
  if(s==="homeC") return {init:["C1","C2"], sig:["CsigA","CsigB"]};
  if(s==="dockDR") return {init:[], sig:["Wsig"]};
  if(s==="dockD"){
    const init=[];
    for(let i=1;i<=15;i++) init.push("D"+i);
    return {init:init.concat(["DP","DN","DB","DL"]), sig:["Dsig"]};
  }
  if(s==="dockE") return {init:[], sig:["Esig"]};
  return {init:[], sig:[]};
}

function needA(){
  return missingA().length===0;
}
function needB(){
  const s = signer();
  if(!s.name || /guest$/i.test(s.name)) return false;
  if(ageYears(s.dob)==null || ageYears(s.dob)<18) return false;
  return !!(state.initials.B1 && state.sigs.Bsig && state.checks.age && state.checks.self);
}
function needOp(){
  const s = signer();
  if(!s.name || ageYears(s.dob)==null || ageYears(s.dob)<21) return false;
  return !!(state.initials.O1 && state.initials.O2 && state.initials.O3 && state.sigs.Osig);
}
function needC(){
  if(!minors().every(p=>p.name && ageYears(p.dob)!=null && ageYears(p.dob)<18)) return false;
  return !!(state.initials.C1 && state.initials.C2 && state.sigs.CsigA && state.sigs.CsigB);
}
function needDR(){
  return !!state.sigs.Wsig;
}
function afterB(){
  if((state.who||"renter")==="husband") persistThen("HOME-B","homeOp");
  else persistThen("HOME-B", hasMinors() ? "homeC" : "done");
}
function needD(){
  for(let i=1;i<=15;i++) if(!state.initials["D"+i]) return false;
  return ["DP","DN","DB","DL"].every(k=>state.initials[k]) && state.sigs.Dsig;
}
function needE(){
  for(let i=1;i<=24;i++) if(!state.checks["E"+i]) return false;
  if(state.who==="instructor") return !!state.sigs.Einstr;
  return !!state.sigs.Esig;
}

function renderSticky(){
  const el=$("sticky");
  const s=state.step;
  let html="";
  if(s==="start") html=`<button class="btn" ${state.esign?"":"disabled"} onclick="startWithConsent()">${state.esign?"I agree — continue":"Tick the box to sign on this phone"}</button>`;
  if(s==="kyc") html=kycSticky();
  if(s==="identity") html=`<button class="btn" onclick="go(state.who==='husband'?'homeB':'homeA')">That's me · continue</button>`;
  if(s==="homeA") html= needA()
    ? `<button class="btn" onclick="persistThen('HOME-A','homeB')">Sign rental · continue to release</button>`
    : `<div><ul class="missing-list">${missingA().map(x=>"<li>"+escHtml(x)+"</li>").join("")}</ul><button class="btn" disabled>Finish the items above</button></div>`;
  if(s==="homeB") html=`<button class="btn" ${needB()?"":"disabled"} onclick="afterB()">${needB()?((state.who==="husband")?"Sign MY release · driver page next":(hasMinors()?"Sign release · child form next":"Sign release · done at home")):"Print YOUR name, initial R3, tick boxes, sign"}</button>`;
  if(s==="homeOp") html=`<button class="btn" ${needOp()?"":"disabled"} onclick="persistThen('HOME-OP','done')">${needOp()?"Save driver paper · done at home":"Three initials and your signature"}</button>`;
  if(s==="homeC") html=`<button class="btn" ${needC()?"":"disabled"} onclick="persistThen('HOME-C','done')">${needC()?"Sign for your child · done at home":"Read both notices, two initials, two signatures"}</button>`;
  if(s==="arrive") html = state.wet==="wear"
    ? `<button class="btn" onclick="go('dockD')">Wearing shorts · start briefing</button>`
    : state.wet==="refuse"
      ? `<button class="btn" onclick="go('dockDR')">Sign the refusal · I will not ride</button>`
      : `<button class="btn" disabled>Choose shorts or refusal</button>`;
  if(s==="dockDR") html=`<button class="btn" ${needDR()?"":"disabled"} onclick="finishRefusal()">${needDR()?"Save refusal · I will not ride":"Sign that you refuse the shorts"}</button>`;
  if(s==="dockD") html=`<button class="btn" ${needD()?"":"disabled"} onclick="persistThen('DOCK-D','ride')">${needD()?"Save briefing card · check ride":"Initial each card, then sign"}</button>`;
  if(s==="ride") html= state.staffOk
    ? `<button class="btn sec" onclick="go('dockE')">Check ride done · Florida card</button>`
    : `<button class="btn" disabled>Instructor unlocks this after the check ride</button>`;
  if(s==="dockE") html=`<button class="btn" ${needE()?"":"disabled"} onclick="finish()">${needE()?"Save Florida card":(state.who==="instructor"?"Instructor: sign after the check ride":"Tick each topic and sign")}</button>`;
  if(s==="staff") html=`<button class="btn" onclick="tryPin()">Unlock instructor pad</button>`;
  if(s==="noride") html=`<button class="btn sec" onclick="go('done')">Done</button>`;
  if(s==="done") html=`<a class="btn" href="/sign/pack.html?b=${encodeURIComponent(BOOKING.id)}" style="display:block;text-align:center;text-decoration:none">Open signed pack</a>`;
  el.innerHTML=html;
}

function applyKycFields(fields){
  if(!fields) return;
  const full = fields.full_name || [fields.first_name, fields.last_name].filter(Boolean).join(" ");
  if(full) setSigner("name", full);
  if(fields.dob) setSigner("dob", fields.dob);
  if(fields.street) setSigner("addr", fields.street);
  if(fields.city) setSigner("city", fields.city);
  if(fields.state) setSigner("state", fields.state);
  if(fields.zip) setSigner("zip", fields.zip);
  if(fields.address && !fields.street){
    const parts = String(fields.address).split(",");
    if(parts[0]) setSigner("addr", parts[0].trim());
  }
  state.kyc.fields = fields;
  save();
}

function kycApi(){
  if(window.JSM_RECORD_API) return String(window.JSM_RECORD_API).replace(/\/$/,"");

}

window.kycContinue = function(){

};
window.kycStartDidit = async function(){
  const status = $("kycStatus");
  if(status) status.textContent = "Opening ID check…";
  try{
    const r = await fetch(kycApi()+"/api/didit/start", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({vendor: BOOKING.id, who: state.who||"renter", return_origin: location.origin})
    });
    const data = await r.json();
    if(!data.ok || !data.url) throw new Error(data.error || "ID check did not start");
    location.href = data.url;
  }catch(err){
    if(status) status.textContent = err.message;
  }
};

async function pullDidit(sid){
  const r = await fetch(kycApi()+"/api/didit/result?session_id="+encodeURIComponent(sid));
  const data = await r.json();
  if(!data.ok) throw new Error(data.error || "Didit result missing");
  state.kyc.session = sid;
  state.kyc.sessionId = sid;
  state.kyc.verdict = data.verdict;
  state.kyc.status = data.status || "";
  state.kyc.score = data.face_score;
  state.kyc.livenessOk = !!data.liveness_ok;
  state.kyc.fields = data.fields || {};
  state.kyc.docType = data.document_type || "";
  state.kyc.reason = data.verdict==="verified" ? "Didit approved the ID and the live selfie." : (data.error || "");
  applyKycFields(state.kyc.fields);
  save();
}

  const steps = currentSteps();
  $("barTitle").textContent = TITLES[state.step]||"Jet Ski Miami";
  const idx = Math.max(0, steps.indexOf(state.step));
  $("barStep").textContent = (idx+1)+" / "+steps.length;
  $("barFill").style.width = (steps.length>1?(idx/(steps.length-1)*100):100)+"%";
  $("app").innerHTML = (VIEWS[state.step]||viewStart)();
  renderSticky();
  requestAnimationFrame(()=>{
    if(state.step==="homeA"){
      ["A1","A2","A3","A4","A5"].forEach(id=>bindPad(id,state.initials));
      bindPad("Asig",state.sigs);
    }
    if(state.step==="homeB"){
      bindPad("B1",state.initials); bindPad("Bsig",state.sigs);
    }
    if(state.step==="homeOp"){
      ["O1","O2","O3"].forEach(id=>bindPad(id,state.initials));
      bindPad("Osig",state.sigs);
    }
    if(state.step==="homeC"){
      bindPad("C1",state.initials); bindPad("C2",state.initials);
      bindPad("CsigA",state.sigs); bindPad("CsigB",state.sigs);
    }
    if(state.step==="dockDR"){
      bindPad("Wsig",state.sigs);
    }
    if(state.step==="dockD"){
      for(let i=1;i<=15;i++) bindPad("D"+i,state.initials);
      ["DP","DN","DB","DL"].forEach(id=>bindPad(id,state.initials));
      bindPad("Dsig",state.sigs);
    }
    if(state.step==="dockE"){
      if(state.who==="instructor") bindPad("Einstr",state.sigs);
      else bindPad("Esig",state.sigs);
    }
  });
}

load();
if(state.who==="husband" && (state.step==="homeA"||state.step==="homeC"||state.step==="sms")) state.step="start";
if(!isDock() && ["arrive","dockDR","dockD","ride","dockE"].includes(state.step)) state.step = "start";
(function takeDiditReturn(){
  const q = new URLSearchParams(location.search);
  const sid = q.get("didit");
  if(!sid) return;
  state.step = "kyc";
  pullDidit(sid).then(()=>{
    history.replaceState({}, "", "/sign/?gtt="+encodeURIComponent(BOOKING.id)+"&who="+encodeURIComponent(state.who||"renter")+"#kyc");
    render();
  }).catch((e)=>{
    state.kyc.verdict = "failed";
    state.kyc.reason = e.message || "ID check did not return a result";
    render();
  });
})();
if(location.hash){
  const h=location.hash.slice(1);
  if(currentSteps().includes(h) && !new URLSearchParams(location.search).get("didit")) state.step=h;
}
render();
setInterval(()=>{ const t=$("timer"); if(t) t.textContent=elapsed(); },500);
</script>
</body>
</html>
